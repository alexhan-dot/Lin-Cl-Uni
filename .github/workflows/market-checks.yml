name: Market checks

on:
  pull_request:
    paths:
      - 'market/**'
      - 'market.*'
      - 'scripts/**'
      - 'deploy/**'
      - 'tests/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'market/**'
      - 'market.*'
      - 'scripts/**'
      - 'deploy/**'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax
        run: node --check market.js
      - name: Check price mapping, collection, storage and schedules
        run: python3 -m unittest discover -s market/tests -v
      - name: Check snapshot upload and public Worker responses
        run: node tests/cloudflare-worker.test.mjs
